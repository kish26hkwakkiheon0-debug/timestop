let lasers=[], platforms=[], goal=null, lava=[];
let sawAngle = 0;

/* ================= 유틸 ================= */
function hit(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x &&
         a.y<b.y+b.h && a.y+a.h>b.y;
}
function hitRotatedRect(player, laser){	//그거

  const cx = laser.x + laser.w/2;
  const cy = laser.y + laser.h/2;
  const angle = -(laser.angle || 0);

  const points = [
    {x: player.x, y: player.y}, // 좌상
    {x: player.x + player.w, y: player.y}, // 우상
    {x: player.x, y: player.y + player.h}, // 좌하
    {x: player.x + player.w, y: player.y + player.h} // 우하
  ];

  for(let p of points){

    const dx = p.x - cx;
    const dy = p.y - cy;

    const rx = dx * Math.cos(angle) - dy * Math.sin(angle);
    const ry = dx * Math.sin(angle) + dy * Math.cos(angle);

    if(
      Math.abs(rx) < laser.w/2 &&
      Math.abs(ry) < laser.h/2
    ){
      return true;
    }
  }

  return false;
}

function hitCircle(rect, circle){

  const cx = circle.x + circle.w/2;
  const cy = circle.y + circle.h/2;
  const r = circle.w/2;

  const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
  const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));

  const dx = cx - closestX;
  const dy = cy - closestY;

  return dx*dx + dy*dy < r*r;
}

function loadStage(i){
  const s=stages[i];
  lasers=s.lasers.map(l=>({...l}));
  platforms=s.platforms.map(p=>({...p}));
  lava=(s.lava||[]).map(l=>({...l}));
  goal={...s.goal};

  player.x=0; player.y=350;
  player.vx=player.vy=0;
  timeStop=false; timeLeft=0; cooldown=0;
}

/* ================= 메뉴 버튼 ================= */
const stageButtons = [];

function buildMenu(){
  stageButtons.length = 0;

  const startX = 200;
  const startY = 220;

  const colWidth = 220;
  const rowHeight = 35;

  const rows = 5; // 한 열에 들어갈 개수

  for(let i=0;i<stages.length;i++){

    const col = Math.floor(i / rows);
    const row = i % rows;

    stageButtons.push({
      x: startX + col * colWidth,
      y: startY + row * rowHeight,
      w: 180,
      h: 28,
      stage: i
    });
  }
}buildMenu();
/* ================= 메뉴 클릭 ================= */
canvas.onclick = (e)=>{
  if(gameMode==="menu"){

    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    stageButtons.forEach(b=>{
      if(mx>b.x && mx<b.x+b.w && my>b.y && my<b.y+b.h){
        stageIndex = b.stage;
        deaths = 0;
        loadStage(stageIndex);
        gameMode="play";
      }
    });

  }
};
/* ================= 업데이트 ================= */
function update(){
  if(gameMode!=="play") return;

  if(timeStop){
    timeLeft--;
    if(timeLeft<=0){ timeStop=false; cooldown=COOL_MAX; }
  } else if(cooldown>0) cooldown--;

  player.vx=0;
  if(keys["ArrowLeft"]) player.vx=-player.speed;
  if(keys["ArrowRight"]) player.vx=player.speed;
  if((keys["ArrowUp"]||keys[" "])&&player.onGround){
    player.vy=-player.jump; player.onGround=false;
  }
  if(keys["Shift"]&&!timeStop&&cooldown===0){
    timeStop=true; timeLeft=STOP_MAX;
  }

  player.vy+=gravity;
  player.x+=player.vx;
  player.y+=player.vy;
  player.onGround=false;

  player.x=Math.max(0,Math.min(768,player.x));
  if(player.y+player.h>=groundY){
    player.y=groundY-player.h;
    player.vy=0; player.onGround=true;
  }

  platforms.forEach(p=>{
    if(player.vy>=0 &&
       player.x+player.w>p.x &&
       player.x<p.x+p.w &&
       player.y+player.h<=p.y+player.vy &&
       player.y+player.h+player.vy>=p.y){
      player.y=p.y-player.h;
      player.vy=0; player.onGround=true;
    }
  });

  if(!timeStop){
    lasers.forEach(l=>{

if(l.rotateSpeed !== undefined){	//그거
  l.angle += l.rotateSpeed;
}

  // Y축 이동
  if(l.vy !== undefined){
    l.y += l.vy;

    const minY = (l.minY !== undefined) ? l.minY : 120;
    const maxY = (l.maxY !== undefined) ? l.maxY : 320;

    if(l.y < minY || l.y + l.h > maxY){
      l.vy *= -1;
    }
  }

  // X축 이동
  if(l.vx !== undefined){
    l.x += l.vx;

    const minX = (l.minX !== undefined) ? l.minX : 0;
    const maxX = (l.maxX !== undefined) ? l.maxX : 800;

    if(l.x < minX || l.x + l.w > maxX){
      l.vx *= -1;
    }
  }

});	//레이저 범위
platforms.forEach(p=>{

  if(p.vy !== undefined){

    p.y += p.vy;

    const min = (p.minY !== undefined) ? p.minY : 0;
    const max = (p.maxY !== undefined) ? p.maxY : 450;

    if(p.y < min || p.y + p.h > max){
      p.vy *= -1;
    }

  }

});	//플랫폼 범위
  }

lasers.forEach(l=>{	//그거

  let collided = false;

  if(l.angle !== undefined){
    collided = hitRotatedRect(player, l);
  } else {
    collided = hit(player, l);
  }

  if(collided){
    deaths++;
    loadStage(stageIndex);
  }

});

lava.forEach(l=>{
  if(hitCircle(player,l)){
    deaths++;
    loadStage(stageIndex);
  }
});

  if(hit(player,goal)){
    stageIndex++;
    if(stageIndex>=stages.length){
      gameMode="menu";
    } else loadStage(stageIndex);
  }
if(!timeStop){
  sawAngle += 0.15;	//톱니 회전
}}

/* ================= 그리기 ================= */
function draw(){
  ctx.fillStyle="#222";
  ctx.fillRect(0,0,800,450);

if(gameMode==="menu"){
  ctx.fillStyle="#fff";
  ctx.font="28px sans-serif";
  ctx.fillText("TIME STOP PUZZLE",270,150);

  ctx.font="18px sans-serif";
  ctx.fillText("Stage Select",350,200);

  ctx.font="16px sans-serif";

  stageButtons.forEach(b=>{
    ctx.fillStyle="#333";
    ctx.fillRect(b.x,b.y,b.w,b.h);

    ctx.strokeStyle="#aaa";
    ctx.strokeRect(b.x,b.y,b.w,b.h);

    ctx.fillStyle="#fff";
    ctx.fillText("Stage "+(b.stage+1), b.x+60, b.y+18);
  });

  return;
}



ctx.fillStyle="#ff3300";
lava.forEach(l=>{

  const cx = l.x + l.w/2;
  const cy = l.y + l.h/2;
  const r = Math.min(l.w,l.h)/2;

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(sawAngle);

  ctx.fillStyle="#ff3333";

  const teeth = 12;

  ctx.beginPath();

  for(let i=0;i<teeth*2;i++){
    const angle = i*Math.PI/teeth;
    const radius = (i%2===0)? r : r*0.7;

    const x = Math.cos(angle)*radius;
    const y = Math.sin(angle)*radius;

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }

  ctx.closePath();
  ctx.fill();

  ctx.restore();

});

  ctx.fillStyle="#555";
  ctx.fillRect(0,groundY,800,4);	//바닥

ctx.fillStyle="#222";
ctx.fillRect(0,groundY+4,800,450-groundY);	//바닥 채색

  ctx.fillStyle="#888";
  platforms.forEach(p=>ctx.fillRect(p.x,p.y,p.w,p.h));

lasers.forEach(l=>{	//그거

  const cx = l.x + l.w/2;
  const cy = l.y + l.h/2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(l.angle || 0);

  ctx.fillStyle="#ff4d4d";
  ctx.fillRect(-l.w/2, -l.h/2, l.w, l.h);

  ctx.restore();

});

  ctx.fillStyle="#4da6ff";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  ctx.fillStyle="#4dff88";
  ctx.fillRect(goal.x,goal.y,goal.w,goal.h);

// ===== UI 흐림 처리 =====
let uiAlpha = 1;

const uiArea = {
  x: 0,
  y: 0,
  w: 220,
  h: 100
};

if(
  player.x < uiArea.x + uiArea.w &&
  player.x + player.w > uiArea.x &&
  player.y < uiArea.y + uiArea.h &&
  player.y + player.h > uiArea.y
){
  uiAlpha = 0.3;
}

ctx.save();
ctx.globalAlpha = uiAlpha;

  ctx.fillStyle="#fff";	//스테이지 UI
  ctx.font="14px sans-serif";
  ctx.fillText(stages[stageIndex].name,20,20);
  ctx.fillText("Deaths: "+deaths,20,40);
  ctx.fillText("TimeStop: "+(timeStop?timeLeft:cooldown),20,60);
/* ================= 타임스탑 UI ================= */

const barX = 20;
const barY = 80;
const barW = 200;
const barH = 14;

ctx.strokeStyle="#fff";
ctx.strokeRect(barX,barY,barW,barH);

let ratio;

if(timeStop){
  ratio = timeLeft / STOP_MAX;
  ctx.fillStyle="#66ccff"; // 사용중
}else{
  ratio = 1 - (cooldown / COOL_MAX);
  ctx.fillStyle="#ffaa33"; // 충전중
}

ctx.fillRect(barX,barY,barW*ratio,barH);

ctx.fillStyle="#fff";
ctx.font="12px sans-serif";
ctx.fillText("Time Stop", barX, barY-5);
ctx.restore();
/* ================= 시간 정지 화면 효과 ================= */

if(timeStop){
  ctx.fillStyle="rgba(200,200,200,0.2)";
  ctx.fillRect(0,0,800,450);
}
}


/* ================= 루프 ================= */
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
