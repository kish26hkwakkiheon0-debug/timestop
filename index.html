const touchState = {
  left: false,
  right: false,
  jump: false,
  shift: false
};


/*
  게임 내부 좌표 기준 버튼.
  캔버스가 모바일 화면에 확대/축소되어도
  이 좌표는 항상 800×550 기준으로 유지된다.

const buttons = {

/*
  현재 화면에서 누르고 있는 포인터들.
  여러 손가락을 동시에 사용할 수 있다.
*/
const activePointers = new Map();


/*
  실제 화면의 터치 위치를
  게임 내부 800×550 좌표로 변환
*/
function getGamePointerPosition(e) {

  const rect = canvas.getBoundingClientRect();

  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}


/*
  모든 현재 포인터를 검사해서
  버튼 상태를 다시 계산한다.
*/
function updateTouchButtons() {

  touchState.left = false;
  touchState.right = false;
  touchState.jump = false;
  touchState.shift = false;


  for (const pointer of activePointers.values()) {

    for (const key in buttons) {

      const b = buttons[key];

      if (
        pointer.x >= b.x &&
        pointer.x <= b.x + b.w &&
        pointer.y >= b.y &&
        pointer.y <= b.y + b.h
      ) {

        touchState[key] = true;
      }
    }
  }
}


/*
  손가락을 누름
*/
canvas.addEventListener("pointerdown", e => {

  /*
    터치/펜/마우스 모두 처리하지만
    PC에서는 기존 키보드 조작을 그대로 사용한다.
  */
  if (e.pointerType === "touch") {

    e.preventDefault();

    const pos = getGamePointerPosition(e);

    activePointers.set(
      e.pointerId,
      pos
    );

    updateTouchButtons();
  }

}, { passive: false });


/*
  손가락을 움직임
*/
canvas.addEventListener("pointermove", e => {

  if (e.pointerType === "touch") {

    e.preventDefault();

    /*
      해당 손가락이 이미 눌려 있을 때만 갱신
    */
    if (activePointers.has(e.pointerId)) {

      const pos = getGamePointerPosition(e);

      activePointers.set(
        e.pointerId,
        pos
      );

      updateTouchButtons();
    }
  }

}, { passive: false });


/*
  손가락을 뗌
*/
canvas.addEventListener("pointerup", e => {

  if (e.pointerType === "touch") {

    e.preventDefault();

    activePointers.delete(
      e.pointerId
    );

    updateTouchButtons();
  }

}, { passive: false });


/*
  터치가 취소되는 경우
*/
canvas.addEventListener("pointercancel", e => {

  if (e.pointerType === "touch") {

    e.preventDefault();

    activePointers.delete(
      e.pointerId
    );

    updateTouchButtons();
  }

}, { passive: false });


/*
  손가락이 캔버스 밖으로 나간 경우에도
  버튼이 계속 눌린 상태로 남지 않게 한다.
*/
canvas.addEventListener("pointerleave", e => {

  if (e.pointerType === "touch") {

    /*
      pointerleave만으로 바로 삭제하지 않는다.
      브라우저에 따라 이동 중에도 발생할 수 있기 때문.
    */

    if (activePointers.has(e.pointerId)) {

      const pos = getGamePointerPosition(e);

      activePointers.set(
        e.pointerId,
        pos
      );

      updateTouchButtons();
    }
  }

}, { passive: false });


/*
  브라우저에서 포인터 캡처가 끊겼을 경우
*/
canvas.addEventListener("lostpointercapture", e => {

  activePointers.delete(
    e.pointerId
  );

  updateTouchButtons();

/* =====================================================
   유틸
   ===================================================== */

function hit(a,b) {

  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}


function hitRotatedRect(player, laser) {

  const cx = laser.x + laser.w / 2;
  const cy = laser.y + laser.h / 2;

  const angle = -(laser.angle || 0);

  const points = [
    {x:player.x, y:player.y},
    {x:player.x + player.w, y:player.y},
    {x:player.x, y:player.y + player.h},
    {x:player.x + player.w, y:player.y + player.h}
  ];

  for (let p of points) {

    const dx = p.x - cx;
    const dy = p.y - cy;

    const rx =
      dx * Math.cos(angle) -
      dy * Math.sin(angle);

    const ry =
      dx * Math.sin(angle) +
      dy * Math.cos(angle);

    if (
      Math.abs(rx) < laser.w / 2 &&
      Math.abs(ry) < laser.h / 2
    ) {
      return true;
    }
  }

  return false;
}


function hitCircle(rect, circle) {

  const cx = circle.x + circle.w / 2;
  const cy = circle.y + circle.h / 2;

  const r = circle.w / 2;

  const closestX =
    Math.max(
      rect.x,
      Math.min(cx, rect.x + rect.w)
    );

  const closestY =
    Math.max(
      rect.y,
      Math.min(cy, rect.y + rect.h)
    );

  const dx = cx - closestX;
  const dy = cy - closestY;

  return dx * dx + dy * dy < r * r;
}


/* =====================================================
   스테이지 로드
   ===================================================== */

function loadStage(i) {

  const s = stages[i];

  lasers = s.lasers.map(l => ({...l}));

  platforms =
    s.platforms.map(p => ({...p}));

  lava =
    (s.lava || []).map(l => ({...l}));

  goal = {...s.goal};

  player.x = 0;
  player.y = 350;

  player.vx = 0;
  player.vy = 0;

  player.onGround = false;

  timeStop = false;
  timeLeft = 0;
  cooldown = 0;
}


/* =====================================================
   메뉴
   ===================================================== */

const stageButtons = [];


function buildMenu() {

  stageButtons.length = 0;

  const startX = 200;
  const startY = 220;

  const colWidth = 220;
  const rowHeight = 35;

  const rows = 5;

  for (
    let i = 0;
    i < stages.length;
    i++
  ) {

    const col = Math.floor(i / rows);
    const row = i % rows;

    stageButtons.push({
      x: startX + col * colWidth,
      y: startY + row * rowHeight,

      w: 180,
      h: 28,

      stage: i
    });
  }
}


buildMenu();


/* =====================================================
   메뉴 클릭
   ===================================================== */

function handleMenuClick(clientX, clientY) {

  if (gameMode !== "menu") return;

  const rect =
    canvas.getBoundingClientRect();

  const mx =
    (clientX - rect.left) *
    (canvas.width / rect.width);

  const my =
    (clientY - rect.top) *
    (canvas.height / rect.height);


  stageButtons.forEach(b => {

    if (
      mx > b.x &&
      mx < b.x + b.w &&
      my > b.y &&
      my < b.y + b.h
    ) {

      stageIndex = b.stage;

      deaths = 0;

      loadStage(stageIndex);

      gameMode = "play";
    }
  });
}


canvas.onclick = e => {

  handleMenuClick(
    e.clientX,
    e.clientY
  );
};


/* =====================================================
   업데이트
   ===================================================== */

function update() {

  if (gameMode !== "play") return;


  /* 시간 정지 */

  if (timeStop) {

    timeLeft--;

    if (timeLeft <= 0) {

      timeStop = false;
      cooldown = COOL_MAX;
    }

  } else if (cooldown > 0) {

    cooldown--;
  }


  /* 이동 */

  player.vx = 0;


  if (
    keys["ArrowLeft"] ||
    touchState.left
  ) {
    player.vx = -player.speed;
  }


  if (
    keys["ArrowRight"] ||
    touchState.right
  ) {
    player.vx = player.speed;
  }


  /* 점프 */

  if (
    (
      keys["ArrowUp"] ||
      keys[" "] ||
      touchState.jump
    ) &&
    player.onGround
  ) {

    player.vy = -player.jump;

    player.onGround = false;
  }


  /* 시간 정지 */

  if (
    (
      keys["Shift"] ||
      touchState.shift
    ) &&
    !timeStop &&
    cooldown === 0
  ) {

    timeStop = true;
    timeLeft = STOP_MAX;
  }


  /* 중력 */

  player.vy += gravity;

  player.x += player.vx;
  player.y += player.vy;

  player.onGround = false;


  /* 화면 경계 */

  player.x =
    Math.max(
      0,
      Math.min(
        768,
        player.x
      )
    );


  /* 바닥 */

  if (
    player.y + player.h >= groundY
  ) {

    player.y =
      groundY - player.h;

    player.vy = 0;

    player.onGround = true;
  }


  /* 발판 */

  platforms.forEach(p => {

    if (
      player.vy >= 0 &&
      player.x + player.w > p.x &&
      player.x < p.x + p.w &&
      player.y + player.h <=
        p.y + player.vy &&
      player.y + player.h +
        player.vy >= p.y
    ) {

      player.y =
        p.y - player.h;

      player.vy = 0;

      player.onGround = true;
    }
  });


  /* 움직이는 장애물 */

  if (!timeStop) {

    lasers.forEach(l => {

      if (
        l.rotateSpeed !== undefined
      ) {

        l.angle += l.rotateSpeed;
      }


      if (
        l.vy !== undefined
      ) {

        l.y += l.vy;

        const minY =
          l.minY !== undefined
          ? l.minY
          : 120;

        const maxY =
          l.maxY !== undefined
          ? l.maxY
          : 320;


        if (
          l.y < minY ||
          l.y + l.h > maxY
        ) {

          l.vy *= -1;
        }
      }


      if (
        l.vx !== undefined
      ) {

        l.x += l.vx;

        const minX =
          l.minX !== undefined
          ? l.minX
          : 0;

        const maxX =
          l.maxX !== undefined
          ? l.maxX
          : 800;


        if (
          l.x < minX ||
          l.x + l.w > maxX
        ) {

          l.vx *= -1;
        }
      }
    });


    platforms.forEach(p => {

      if (
        p.vy !== undefined
      ) {

        p.y += p.vy;

        const min =
          p.minY !== undefined
          ? p.minY
          : 0;

        const max =
          p.maxY !== undefined
          ? p.maxY
          : 450;


        if (
          p.y < min ||
          p.y + p.h > max
        ) {

          p.vy *= -1;
        }
      }
    });
  }


  /* 레이저 충돌 */

  lasers.forEach(l => {

    let collided = false;


    if (
      l.angle !== undefined
    ) {

      collided =
        hitRotatedRect(
          player,
          l
        );

    } else {

      collided =
        hit(player, l);
    }


    if (collided) {

      deaths++;

      loadStage(stageIndex);
    }
  });


  /* 톱니/용암 충돌 */

  lava.forEach(l => {

    if (
      hitCircle(player, l)
    ) {

      deaths++;

      loadStage(stageIndex);
    }
  });


  /* 목표 */

  if (
    hit(player, goal)
  ) {

    stageIndex++;

    if (
      stageIndex >= stages.length
    ) {

      gameMode = "menu";

    } else {

      loadStage(stageIndex);
    }
  }


  if (!timeStop) {

    sawAngle += 0.15;
  }
}


/* =====================================================
   그리기
   ===================================================== */

function draw() {

  ctx.fillStyle = "#222";

  ctx.fillRect(
    0,
    0,
    800,
    550
  );


  /* =================================================
     메뉴
     ================================================= */

  if (gameMode === "menu") {

    ctx.fillStyle = "#fff";

    ctx.font = "28px sans-serif";

    ctx.fillText(
      "TIME STOP PUZZLE",
      270,
      150
    );


    ctx.font = "18px sans-serif";

    ctx.fillText(
      "Stage Select",
      350,
      200
    );


    ctx.font = "16px sans-serif";


    stageButtons.forEach(b => {

      ctx.fillStyle = "#333";

      ctx.fillRect(
        b.x,
        b.y,
        b.w,
        b.h
      );


      ctx.strokeStyle = "#aaa";

      ctx.strokeRect(
        b.x,
        b.y,
        b.w,
        b.h
      );


      ctx.fillStyle = "#fff";

      ctx.fillText(
        "Stage " + (b.stage + 1),
        b.x + 60,
        b.y + 18
      );
    });


    return;
  }


  /* =================================================
     장애물
     ================================================= */

  lava.forEach(l => {

    const cx =
      l.x + l.w / 2;

    const cy =
      l.y + l.h / 2;

    const r =
      Math.min(
        l.w,
        l.h
      ) / 2;


    ctx.save();

    ctx.translate(
      cx,
      cy
    );

    ctx.rotate(
      sawAngle
    );


    ctx.fillStyle = "#ff3333";


    const teeth = 12;

    ctx.beginPath();


    for (
      let i = 0;
      i < teeth * 2;
      i++
    ) {

      const angle =
        i * Math.PI / teeth;

      const radius =
        i % 2 === 0
        ? r
        : r * 0.7;


      const x =
        Math.cos(angle) * radius;

      const y =
        Math.sin(angle) * radius;


      if (i === 0) {

        ctx.moveTo(x, y);

      } else {

        ctx.lineTo(x, y);
      }
    }


    ctx.closePath();

    ctx.fill();

    ctx.restore();
  });


  /* =================================================
     게임 영역
     ================================================= */

  ctx.fillStyle = "#555";

  ctx.fillRect(
    0,
    groundY,
    800,
    4
  );


  ctx.fillStyle = "#1a1a1a";

  ctx.fillRect(
    0,
    groundY + 4,
    800,
    450 - (groundY + 4)
  );


  /* 발판 */

  ctx.fillStyle = "#888";

  platforms.forEach(p => {

    ctx.fillRect(
      p.x,
      p.y,
      p.w,
      p.h
    );
  });


  /* 레이저 */

  lasers.forEach(l => {

    const cx =
      l.x + l.w / 2;

    const cy =
      l.y + l.h / 2;


    ctx.save();

    ctx.translate(
      cx,
      cy
    );

    ctx.rotate(
      l.angle || 0
    );


    ctx.fillStyle = "#ff4d4d";


    ctx.fillRect(
      -l.w / 2,
      -l.h / 2,
      l.w,
      l.h
    );


    ctx.restore();
  });


  /* 플레이어 */

  ctx.fillStyle = "#4da6ff";

  ctx.fillRect(
    player.x,
    player.y,
    player.w,
    player.h
  );


  /* 목표 */

  ctx.fillStyle = "#4dff88";

  ctx.fillRect(
    goal.x,
    goal.y,
    goal.w,
    goal.h
  );


  /* =================================================
     상단 UI
     ================================================= */

  let uiAlpha = 1;


  const uiArea = {
    x: 0,
    y: 0,
    w: 220,
    h: 100
  };


  if (
    player.x <
      uiArea.x + uiArea.w &&
    player.x + player.w >
      uiArea.x &&
    player.y <
      uiArea.y + uiArea.h &&
    player.y + player.h >
      uiArea.y
  ) {

    uiAlpha = 0.3;
  }


  ctx.save();

  ctx.globalAlpha = uiAlpha;


  ctx.fillStyle = "#fff";

  ctx.font = "14px sans-serif";


  ctx.fillText(
    stages[stageIndex].name,
    20,
    20
  );


  ctx.fillText(
    "Deaths: " + deaths,
    20,
    40
  );


  ctx.fillText(
    "TimeStop: " +
    (
      timeStop
      ? timeLeft
      : cooldown
    ),
    20,
    60
  );


  /* 타임스탑 게이지 */

  const barX = 20;
  const barY = 80;
  const barW = 200;
  const barH = 14;


  ctx.strokeStyle = "#fff";

  ctx.strokeRect(
    barX,
    barY,
    barW,
    barH
  );


  let ratio =
    timeStop
    ? timeLeft / STOP_MAX
    : 1 - cooldown / COOL_MAX;


  ctx.fillStyle =
    timeStop
    ? "#66ccff"
    : "#ffaa33";


  ctx.fillRect(
    barX,
    barY,
    barW * ratio,
    barH
  );


  ctx.fillStyle = "#fff";

  ctx.font = "12px sans-serif";


  ctx.fillText(
    "Time Stop",
    barX,
    barY - 5
  );


  ctx.restore();


  /* =================================================
     시간 정지 효과
     ================================================= */

  if (timeStop) {

    ctx.fillStyle =
      "rgba(200,200,200,0.2)";

    ctx.fillRect(
      0,
      0,
      800,
      450
    );
  }


  /* =================================================
     모바일 컨트롤 영역
     ================================================= */

  ctx.fillStyle = "#111";

  ctx.fillRect(
    0,
    450,
    800,
    100
  );


  ctx.strokeStyle = "#444";

  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(
    0,
    450
  );

  ctx.lineTo(
    800,
    450
  );

  ctx.stroke();


  /* =================================================
     버튼
     ================================================= */

  for (const key in buttons) {

    const b = buttons[key];

    const isPressed =
      touchState[key];


    ctx.fillStyle =
      isPressed
      ? "#555"
      : "#333";


    ctx.fillRect(
      b.x,
      b.y,
      b.w,
      b.h
    );


    ctx.strokeStyle =
      isPressed
      ? "#fff"
      : "#888";


    ctx.lineWidth = 2;


    ctx.strokeRect(
      b.x,
      b.y,
      b.w,
      b.h
    );


    ctx.fillStyle =
      isPressed
      ? "#fff"
      : "#ccc";


    ctx.font =
      "bold 16px sans-serif";


    ctx.textAlign = "center";

    ctx.textBaseline = "middle";


    ctx.fillText(
      b.label,
      b.x + b.w / 2,
      b.y + b.h / 2
    );
  }


  ctx.textAlign = "left";

  ctx.textBaseline = "alphabetic";
}


/* =====================================================
   게임 루프
   ===================================================== */

function loop() {

  update();

  draw();

  requestAnimationFrame(loop);
}


loop();


/* =====================================================
   화면 회전/크기 변경 대응
   ===================================================== */


</script>

</body>
</html>
